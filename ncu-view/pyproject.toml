[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncu-view"
version = "0.2.0"
description = "Nsight-Compute-style kernel profile reports as a self-contained web page"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cuda", "ncu", "nsight", "gpu", "profiling", "cutlass", "cute"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
ncu = ["ncu-report>=2026.1"]   # read .ncu-rep files (NVIDIA's own reader)
modal = ["modal>=1.0"]          # the `profile` command (profiles on Modal)
all = ["ncu-report>=2026.1", "modal>=1.0"]
dev = ["pytest>=7", "ruff>=0.5", "pyflakes>=3"]

[project.scripts]
ncu-view = "ncu_view.cli:main"

[tool.setuptools]
packages = ["ncu_view"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# standalone harness scripts: sys.path insert before imports is intentional
"tests/test_against_ncu.py" = ["E402"]
"tests/test_blog_dataset.py" = ["E402"]